name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by the Supabase Database Webhook on tried_entries (see
  # supabase/README.md) whenever the admin page saves, publishes, or deletes
  # an entry -- the build step re-fetches from Supabase, so this is what
  # gets an edit live without a manual push.
  repository_dispatch:
    types: [content-updated]
  # Fallback for when the webhook above is not firing. It has fired exactly once
  # in this project's history (2026-08-22), so an admin save has never actually
  # reached the live site: the write lands in Supabase and nothing rebuilds.
  #
  # This picks the content up on a timer instead. It is a workaround, not the
  # design -- it rebuilds whether or not anything changed, and an edit waits up
  # to 15 minutes instead of ~40 seconds. Once steps 3 and 4 of
  # supabase/README.md are done and a save shows up as a repository_dispatch
  # run, delete this block.
  schedule:
    - cron: '*/15 * * * *'

# Builds from the committed snapshots in imported/, so a deploy never depends on
# an external host being up. Use "Refresh imported pages" to update them.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          # Overrides pages.json's site.base, so a custom domain or a repo
          # rename needs no code change.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
